<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="robots" content="noindex,nofollow">
  <title>履歷內容編輯器｜李冠廷</title>
  <link rel="stylesheet" href="./editor.css">
  <script src="./editor.js" defer></script>
</head>
<body>
  <header class="editor-header">
    <div>
      <a href="../" class="back-link">← 返回履歷</a>
      <p class="eyebrow">LOCAL CONTENT STUDIO</p>
      <h1>履歷內容編輯器</h1>
      <p>所有修改只保存在這台裝置的瀏覽器，匯出後再放回專案即可發布。</p>
    </div>
    <span class="privacy-badge">不會上傳資料</span>
  </header>
  <main>
    <aside class="guide">
      <h2>更新流程</h2>
      <ol>
        <li>在表單中修改內容。</li>
        <li>按「下載 resume.json」。</li>
        <li>用下載檔取代 <code>content/resume.json</code>。</li>
        <li>執行 <code>npm run build</code> 與 <code>npm run check</code> 後提交。</li>
      </ol>
      <p>瀏覽器會自動保留草稿。公開前請再次確認個資、公司機密與成果數字。</p>
      <nav id="section-nav" aria-label="編輯區段"></nav>
    </aside>
    <section class="workspace" aria-labelledby="workspace-title">
      <div class="toolbar">
        <div>
          <h2 id="workspace-title">內容資料</h2>
          <p id="status" role="status" aria-live="polite">正在載入…</p>
        </div>
        <div class="toolbar-actions">
          <label class="button secondary">匯入 JSON<input id="import-file" type="file" accept="application/json,.json"></label>
          <button class="button secondary" id="reset" type="button">還原網站版本</button>
          <button class="button primary" id="download" type="button">下載 resume.json</button>
        </div>
      </div>
      <form id="editor-form"></form>
    </section>
  </main>
  <template id="scalar-template">
    <label class="field"><span></span><input></label>
  </template>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
